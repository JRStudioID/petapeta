name: Deploy Petapeta

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.PETAPETA_DEPLOY_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "$SSH_PRIVATE_KEY_B64" | tr -d '[:space:]' | base64 --decode > ~/.ssh/petapeta_deploy
          chmod 600 ~/.ssh/petapeta_deploy

          ssh-keyscan -H 43.156.185.38 >> ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/petapeta_deploy \
            -o IdentitiesOnly=yes \
            ubuntu@43.156.185.38 \
            '/home/ubuntu/deploy-petapeta.sh'
